<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bottleBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1b2820" />
      <stop offset="100%" stop-color="#121814" />
    </radialGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3d30" />
      <stop offset="35%" stop-color="#3d5241" />
      <stop offset="70%" stop-color="#2a3a2d" />
      <stop offset="100%" stop-color="#1e2920" />
    </linearGradient>
    <filter id="flaskShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bottleBg)" />
  <circle cx="300" cy="300" r="220" fill="none" stroke="#c5ee89" stroke-opacity="0.08" stroke-dasharray="4 6" />

  <g filter="url(#flaskShadow)" transform="translate(300, 300)">
    <!-- Loop Handle -->
    <path d="M-22 -200 C-22 -228 22 -228 22 -200" fill="none" stroke="#526654" stroke-width="8" stroke-linecap="round" />
    <!-- Cap -->
    <rect x="-32" y="-200" width="64" height="35" rx="5" fill="#1b241c" stroke="#5b735d" stroke-width="2" />
    <rect x="-26" y="-195" width="52" height="6" fill="#324234" />
    <!-- Neck -->
    <rect x="-26" y="-165" width="52" height="20" fill="#202b21" stroke="#485c49" stroke-width="2" />
    <!-- Bottle Body -->
    <path d="M-60 -145 
             C-60 -145 -55 -125 -65 -110 
             L-65 170 
             C-65 185 -50 195 -35 195 
             L35 195 
             C50 195 65 185 65 170 
             L65 -110 
             C55 -125 60 -145 60 -145 
             Z" 
          fill="url(#flaskGrad)" stroke="#4d634f" stroke-width="2.5" />

    <!-- Specular Highlight -->
    <path d="M-35 -105 L-35 165" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" stroke-linecap="round" />

    <!-- Engraved Touch Grass Logo -->
    <circle cx="0" cy="20" r="32" fill="none" stroke="#c5ee89" stroke-width="1.5" stroke-opacity="0.75" />
    <path d="M0 32 V12 M0 20 C-8 16 -12 10 -12 4 C0 2 0 10 0 20 Z M0 20 C8 16 12 10 12 4 C0 2 0 10 0 20 Z" fill="#c5ee89" fill-opacity="0.85" />
    <text x="0" y="70" text-anchor="middle" fill="#c5ee89" font-family="system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="2">32 OZ • THERMAL</text>
  </g>

  <rect x="235" y="520" width="130" height="24" rx="12" fill="#1b241c" stroke="#c5ee89" stroke-opacity="0.3" stroke-width="1" />
  <text x="300" y="536" text-anchor="middle" fill="#c5ee89" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">COLD FOR 24 HRS</text>
</svg>
