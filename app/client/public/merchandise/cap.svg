<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="capBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1f2c20" />
      <stop offset="100%" stop-color="#121812" />
    </radialGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b4a39" />
      <stop offset="70%" stop-color="#2a3628" />
      <stop offset="100%" stop-color="#1d261c" />
    </linearGradient>
    <filter id="capShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#capBg)" />
  <circle cx="300" cy="300" r="220" fill="none" stroke="#c5ee89" stroke-opacity="0.08" stroke-dasharray="4 6" />

  <g filter="url(#capShadow)">
    <!-- Cap Crown -->
    <path d="M190 320 C190 200 410 200 410 320 Z" fill="url(#capGrad)" stroke="#4a5c48" stroke-width="2.5" />
    <!-- Cap Brim -->
    <path d="M160 325 C160 325 210 295 300 295 C390 295 440 325 440 325 C470 345 420 375 300 375 C180 375 130 345 160 325 Z" fill="#253024" stroke="#485b46" stroke-width="2.5" />
    <!-- Brim edge highlight -->
    <path d="M170 338 C230 365 370 365 430 338" fill="none" stroke="#5d725a" stroke-width="2" />
    <!-- Top button -->
    <ellipse cx="300" cy="205" rx="14" ry="7" fill="#1b231a" stroke="#526650" stroke-width="2" />
    <!-- Panel seams -->
    <path d="M300 210 L300 295" stroke="#253023" stroke-width="2" />
    <path d="M300 210 C260 235 230 270 210 315" stroke="#253023" stroke-width="2" />
    <path d="M300 210 C340 235 370 270 390 315" stroke="#253023" stroke-width="2" />

    <!-- Embroidered Patch -->
    <g transform="translate(300, 260)">
      <rect x="-35" y="-20" width="70" height="40" rx="6" fill="#151d15" stroke="#c5ee89" stroke-width="1.5" />
      <path d="M-15 8 C-15 -5 0 -12 0 -12 C0 -12 15 -5 15 8" fill="none" stroke="#c5ee89" stroke-width="1.8" />
      <circle cx="0" cy="-2" r="3" fill="#c5ee89" />
      <text x="0" y="14" text-anchor="middle" fill="#c5ee89" font-family="system-ui, sans-serif" font-size="6" font-weight="700" letter-spacing="1">FIELD CLUB</text>
    </g>
  </g>

  <rect x="235" y="520" width="130" height="24" rx="12" fill="#1b241c" stroke="#c5ee89" stroke-opacity="0.3" stroke-width="1" />
  <text x="300" y="536" text-anchor="middle" fill="#c5ee89" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">ADJUSTABLE STRAP</text>
</svg>
