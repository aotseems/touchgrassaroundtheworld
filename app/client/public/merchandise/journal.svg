<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="journalBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f2c22" />
      <stop offset="100%" stop-color="#121813" />
    </radialGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3826" />
      <stop offset="100%" stop-color="#1a2316" />
    </linearGradient>
    <filter id="journalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#journalBg)" />
  <circle cx="300" cy="300" r="220" fill="none" stroke="#c5ee89" stroke-opacity="0.08" stroke-dasharray="4 6" />

  <g filter="url(#journalShadow)" transform="translate(180, 110)">
    <!-- Back page stack shadow -->
    <rect x="18" y="14" width="225" height="340" rx="12" fill="#d9dfcc" />
    <rect x="12" y="8" width="225" height="340" rx="12" fill="#e8eee0" />
    <!-- Book Cover -->
    <rect x="0" y="0" width="230" height="345" rx="12" fill="url(#coverGrad)" stroke="#4a5b3f" stroke-width="2" />
    
    <!-- Spine texture -->
    <line x1="28" y1="0" x2="28" y2="345" stroke="#161e12" stroke-width="3" />
    <line x1="31" y1="0" x2="31" y2="345" stroke="#485c3f" stroke-width="1.5" />

    <!-- Gold leaf emblem -->
    <g transform="translate(125, 140)">
      <circle cx="0" cy="0" r="42" fill="#202a1c" stroke="#c5ee89" stroke-width="1.5" />
      <path d="M0 25 C0 25 -18 8 -18 -8 C-18 -22 0 -28 0 -28 C0 -28 18 -22 18 -8 C18 8 0 25 0 25 Z" fill="none" stroke="#c5ee89" stroke-width="2" />
      <line x1="0" y1="20" x2="0" y2="-22" stroke="#c5ee89" stroke-width="1.5" />
      <line x1="0" y1="0" x2="-8" y2="-8" stroke="#c5ee89" stroke-width="1.2" />
      <line x1="0" y1="6" x2="8" y2="-2" stroke="#c5ee89" stroke-width="1.2" />
      <line x1="0" y1="-8" x2="-6" y2="-15" stroke="#c5ee89" stroke-width="1.2" />
    </g>

    <!-- Typography -->
    <text x="125" y="215" text-anchor="middle" fill="#c5ee89" font-family="Georgia, serif" font-size="14" font-weight="700" letter-spacing="3">FIELD NOTES</text>
    <text x="125" y="235" text-anchor="middle" fill="#a0ad91" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="2">BOTANICAL LOG &amp; MAPS</text>
    
    <!-- Elastic Band -->
    <rect x="185" y="0" width="14" height="345" rx="3" fill="#151c13" stroke="#36452f" stroke-width="1" />
  </g>

  <rect x="235" y="520" width="130" height="24" rx="12" fill="#1b241c" stroke="#c5ee89" stroke-opacity="0.3" stroke-width="1" />
  <text x="300" y="536" text-anchor="middle" fill="#c5ee89" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">WATERPROOF PAPER</text>
</svg>
