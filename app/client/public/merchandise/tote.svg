<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="toteBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f2c22" />
      <stop offset="100%" stop-color="#121813" />
    </radialGradient>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6ceb8" />
      <stop offset="60%" stop-color="#c5bc9f" />
      <stop offset="100%" stop-color="#b0a78b" />
    </linearGradient>
    <filter id="toteShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#toteBg)" />
  <circle cx="300" cy="300" r="220" fill="none" stroke="#c5ee89" stroke-opacity="0.08" stroke-dasharray="4 6" />

  <g filter="url(#toteShadow)">
    <!-- Straps -->
    <path d="M230 250 L230 110 C230 80 370 80 370 110 L370 250" fill="none" stroke="#253225" stroke-width="18" stroke-linecap="round" />
    <path d="M230 250 L230 110 C230 80 370 80 370 110 L370 250" fill="none" stroke="#364936" stroke-width="12" stroke-linecap="round" />

    <!-- Bag Body -->
    <path d="M180 230 L420 230 L400 480 C398 490 390 495 380 495 L220 495 C210 495 202 490 200 480 Z" fill="url(#canvasGrad)" stroke="#8f866d" stroke-width="2" />
    
    <!-- Top Hem -->
    <rect x="180" y="230" width="240" height="24" fill="#beaf94" stroke="#8f866d" stroke-width="1" />

    <!-- Center Graphic on Tote -->
    <g transform="translate(300, 360)">
      <circle cx="0" cy="0" r="54" fill="#202a1e" stroke="#2e3f2c" stroke-width="2" />
      <!-- Stylized sprout / plant -->
      <path d="M0 24 V-10 M0 0 C-14 -10 -20 -2 0 -22 M0 6 C14 -4 20 4 0 -16" fill="none" stroke="#c5ee89" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="0" y="34" text-anchor="middle" fill="#c5ee89" font-family="system-ui, sans-serif" font-size="7" font-weight="700" letter-spacing="2">TAKE THE SCENIC ROUTE</text>
    </g>
  </g>

  <rect x="235" y="525" width="130" height="24" rx="12" fill="#1b241c" stroke="#c5ee89" stroke-opacity="0.3" stroke-width="1" />
  <text x="300" y="541" text-anchor="middle" fill="#c5ee89" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1">16 OZ HEAVY CANVAS</text>
</svg>
